[project]
name = "safe-prompt"
version = "0.1.0"
description = "A type-safe, Pydantic-powered library for defining and validating prompts in LLM workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alon Gadot", email = "alongadot@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["llm", "prompt", "template", "pydantic", "type-safety", "validation"]
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.11.4",
    "typing-extensions>=4.13.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/safe-prompt"
Issues = "https://github.com/yourusername/safe-prompt/issues"

[project.scripts]
safe-prompt = "safe_prompt:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_prompt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/safe_prompt",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.mypy]
mypy_path = ["src"]
plugins = ["safe_prompt.mypy_plugin"]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py39"
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.7",
    "setuptools>=80.0.1",
]
